[project]
name = "sysone"
version = "0.1.0"
description = "Contestability-oriented explanation harness for black-box decision models (Jev)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35",
    "google-genai>=1.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[dependency-groups]
analysis = [
    "matplotlib>=3.11.2",
]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sysone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
