# Named model aliases used by the harness. Code refers to aliases, never raw IDs.
# Any model ID starting with "TODO" is a placeholder: the client refuses to call it.
#
# Every alias needs a matching price in configs/pricing.yaml, or calls are refused.

jev:
  # TypeSafe's native API, which returns a probability for every option.
  # jev-latest is an alias that moves when TypeSafe ships a release (it pointed to
  # jev-1.14.0 on 2026-10-26). Every response names the exact version that answered,
  # and experiment runs lock to one version and halt if it changes. To keep using a
  # version after the alias moves, set model to its fixed ID, e.g. jev-1.14.0.
  provider: typesafe
  model: jev-latest

case_writer:
  # Writes natural-language realizations of synthetic benchmark cases.
  # Deliberately a different model from Jev, so the generator is not the model judged.
  # "us." is the US cross-region inference profile, required for this model in us-east-2.
  provider: bedrock
  model: us.anthropic.claude-opus-4-5-20251101-v1:0

# TODO: choose explainer models (Bedrock and Gemini). Placeholders below.
explainer_bedrock:
  provider: bedrock
  model: TODO_BEDROCK_EXPLAINER_MODEL_ID

explainer_gemini:
  provider: gemini
  model: TODO_GEMINI_EXPLAINER_MODEL_ID

# TODO: choose the LLM judge for free-text stretch-goal scoring. It should come
