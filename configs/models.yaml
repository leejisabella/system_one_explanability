# Named model aliases used by the harness. Code refers to aliases, never raw IDs.
# Any model ID starting with "TODO" is a placeholder: the client refuses to call it.
#
# Every alias needs a matching price in configs/pricing.yaml, or calls are refused.
# Optional per-model request settings:
#   service_tier: a provider tier such as Bedrock's "flex"; it also needs a tier price.
#   reasoning_effort: the model's reasoning level (Gemini thinking_level, gpt-oss reasoning_effort).
#
# Roles keep model families apart (chosen 2026-10-27, research_docs/12): the case writers
# differ from every explainer, and the simulator and judge differ from every explainer
# they score. Families: Jev (TypeSafe), Anthropic, Google, Meta (explainers), OpenAI
# (simulator, judge), Qwen and Mistral (case writers), Amazon (Experiment 8).

jev:
  # TypeSafe's native API, which returns a probability for every option.
  # jev-latest is an alias that moves when TypeSafe ships a release (it pointed to
  # jev-1.14.0 on 2026-10-26). Every response names the exact version that answered,
  # and experiment runs lock to one version and halt if it changes. To keep using a
  # version after the alias moves, set model to its fixed ID, e.g. jev-1.14.0.
  provider: typesafe
  model: jev-latest

case_writer:
  # Writes natural-language realizations of the synthetic benchmark cases (step 6b).
  # Qwen, so it is neither Jev nor from any explainer's family.
  provider: bedrock
  model: qwen.qwen3-235b-a22b-2507-v1:0

case_writer_2:
  # A second, independent generation procedure for the benchmark text (Risk 2).
  provider: bedrock
  model: mistral.mistral-large-3-675b-instruct

explainer_bedrock:
  # Claude Haiku 5.5 through the global cross-Region profile (10% cheaper than us.).
  # Not usable yet: AWS refuses the Marketplace subscription for this account (2026-10-28).
  provider: bedrock
  model: global.anthropic.claude-haiku-5-5

explainer_gemini:
  # Gemini API (GEMINI_API_KEY). Google doesn't document turning thinking fully off for
  # 3.1 Flash-Lite, so it runs at the lowest level; thinking tokens are billed as output.
  provider: gemini
  model: gemini-3.1-flash-lite
  reasoning_effort: minimal

explainer_open:
  # Open-weight explainer: Pilot 1's second explainer while Claude is blocked, and the
  # stretch goal's open-weight model.
  provider: bedrock
  model: us.meta.llama4-maverick-17b-instruct-v1:0

simulator:
  # Pilot 1 faithfulness scoring: predicts Jev's decision on hidden variants from a frozen
  # explanation. OpenAI family, unlike every explainer. Flex tier: half price, slower.
  provider: bedrock
  model: openai.gpt-oss-120b-1:0
  service_tier: flex
  reasoning_effort: low

judge:
  # LLM judge for free-text scoring (Pilot 2 onward). Same model as the simulator, which
  # the design allows: it is from a different family than every explainer it scores.
  provider: bedrock
  model: openai.gpt-oss-120b-1:0
  service_tier: flex
  reasoning_effort: low

decision_alt:
  # A second decision model for Experiment 8 (generalization beyond Jev). Amazon family.
  provider: bedrock
  model: amazon.nova-lite-v1:0
