# USD per 1M tokens, keyed by provider then model ID.
# The cost guard refuses to call any model that is not listed here.
# Output prices must cover reasoning/thinking tokens (every provider here bills them as output).
# A model entry may also list service-tier prices, e.g. flex: {input: ..., output: ...}.
#
# When a published price is scheduled to rise, the higher price is used so the
# worst-case estimate stays conservative. Re-verify prices before large runs.

typesafe:
  # From docs.typesafe.ai/models (checked 2026-10-26): Jev 1.13 and 1.14 cost $42 per
  # billion input tokens ($0.042 per 1M). Output tokens are free. If jev-latest moves
  # to a release with a different price, update this entry.
  jev-latest: {input: 0.042, output: 0.0}
  jev-1.14.0: {input: 0.042, output: 0.0}
  jev-1.13.0: {input: 0.042, output: 0.0}

openrouter:
  # For OpenRouter, these numbers are also sent as provider.max_price, so OpenRouter
  # refuses to route to anything more expensive. No model uses OpenRouter at the moment.

bedrock:
  # Official AWS Price List files for us-east-2 (AmazonBedrock and AmazonBedrockFoundationModels
  # offers, publication date 2026-10-12, read 2026-10-27), standard on-demand tier.
  # Cross-Region profiles (us., global.) are billed at these prices. Claude is billed
  # through AWS Marketplace; the others by Bedrock itself.
  # Claude Haiku 5.5 charges 5x more above its long-context threshold; our prompts are a
  # few thousand tokens, far below it.
  global.anthropic.claude-haiku-5-5:          {input: 0.10, output: 0.50}
  qwen.qwen3-235b-a22b-2507-v1:0:             {input: 0.22, output: 0.88}
  mistral.mistral-large-3-675b-instruct:      {input: 0.50, output: 1.50}
  us.meta.llama4-maverick-17b-instruct-v1:0:  {input: 0.24, output: 0.97}
  amazon.nova-lite-v1:0:                      {input: 0.06, output: 0.24}
  # Flex is charged only when Bedrock's response confirms the flex tier served the call;
  # otherwise the standard price is charged.
  openai.gpt-oss-120b-1:0:                    {input: 0.15, output: 0.60, flex: {input: 0.075, output: 0.30}}

gemini:
  # Paid-tier Gemini API prices from ai.google.dev/gemini-api/docs/pricing (checked 2026-10-21,
  # re-checked 2026-10-27).
  # Where a price rises on Dec 1, 2026 or Jan 1, 2027, the later price is listed.
  # Gemini 2.5 Pro and 3.1 Pro charge more above 200k input tokens; the higher tier is listed.
  # The project uses the Gemini API, not Vertex AI (whose prices may differ).
  gemini-4-argon:          {input: 4.00, output: 20.00}
  gemini-3.1-pro-preview:  {input: 4.00, output: 18.00}
  gemini-3.8-flash:        {input: 1.50, output: 7.50}
  gemini-3.6-flash:        {input: 1.50, output: 7.50}
  gemini-3.5-flash-lite:   {input: 0.30, output: 2.50}
  gemini-3.1-flash-lite:   {input: 0.25, output: 1.50}
  gemini-2.5-pro:          {input: 2.50, output: 15.00}
  gemini-2.5-flash:        {input: 0.30, output: 2.50}
  gemini-2.5-flash-lite:   {input: 0.10, output: 0.40}
