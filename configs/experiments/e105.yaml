# E.105: reasoning traces for E.104's mix, then the training datasets (research_docs/14).
# On our own GPU, $0: the traces must be the Qwen reviewer's own, and Bedrock serves Qwen3 only
# without thinking. About 17,000 examples (every review-format mix row, and every mix item alone),
# 2 to 4 reviewer samples each: about 40,000 calls to the served base, then the teacher on unsolved
# examples. Serve one model at a time: base_local for `--steps traces`, then teacher_local for
# `--steps teacher`; `--steps export` needs no server.

source_run: e104-v1-REPLACE          # the E.104 run whose mix.jsonl this traces
samples: [civil_toxicity_train_v1, wildguard_prompt_train_v1, wildguard_response_train_v1]
datasets:
  - name: part2_all_v1               # E.106/E.107: every training pool
    samples: [civil_toxicity_train_v1, wildguard_prompt_train_v1, wildguard_response_train_v1]
  - name: part2_no_responses_v1      # E.108's held-out domain: no WildGuard responses in training
    samples: [civil_toxicity_train_v1, wildguard_prompt_train_v1]
reviewer: base_local                 # self-hosted Qwen3-14B, the model being trained: its own traces (rejection sampling)
teacher: teacher_local               # self-hosted Qwen3-32B with thinking, for examples the reviewer never solves
min_samples: 2                       # stop once there is a correct trace and a wrong one, or this many tries
max_samples: 4
teacher_samples: 2
reviewer_temperature: null
reviewer_reasoning_max_tokens: 4096
reviewer_max_output_tokens: 256
max_rows_per_sample: null            # e.g. 100 for a pilot
workers: 32                          # vLLM batches concurrent requests
max_items: null
use_cache: false
max_consecutive_errors: 10
steps: [traces, teacher, export]
run_provider_caps_usd: {bedrock: 0.01, typesafe: 0.01}   # GPU-only: a paid call is a mistake (caps must be positive)
