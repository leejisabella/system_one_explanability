# E.22: a reviewer from another family, on WildGuard (research_docs/17). Bedrock, no Jev calls.
# Written and fixed on 2026-11-24, before the run (go-ahead given by the user 2026-11-24).
# E.119's design on E.102's frozen plan, WildGuard prompts and responses only, with Mistral Large 3 as
# the reviewer. Same items, Jev labels, matched random labels and subsample (400 + 400).

source_run: e102-v1-2026-11-04
samples: [wildguard_prompt_full_v1, wildguard_response_full_v1]
reviewer: reviewer_mistral
alone_samples: 3
max_output_tokens: 1500          # written reasoning, then the JSON (E.112's "written" mode)
# Protocol difference from E.102/E.119, stated: Mistral isn't a reasoning model, so the standard reviewer
# prompt gets E.112's instruction to write its reasoning first (task_prefix). Everything else unchanged.

# Decision rule, fixed before the run. On E.102's WildGuard subsample (800 items, 400 per pool, pooled
# with equal weight), paired on the same items:
#   "Another family fixes it on WildGuard" if BOTH
#   1. Mistral cascade - Jev alone > 0 with the 95% paired bootstrap interval above 0; and
#   2. the cascade's harmful-let-through rate (gold harmful, final unharmful, share of all items) is at
#      most 1 point above Jev alone's (point estimate): the leniency guard.
rule: {ci_lower_above: 0.0, max_let_through_increase: 0.01}
# Reported, not in the rule: Mistral alone vs Jev; Mistral cascade vs the 20b and 120b cascades; phi with
# Jev; override of Jev's mistakes by the 20b's never/sometimes/always record; parse rate; the result
# without step 0's 30 read items (research_analyses/Round2_summary, if their IDs are recorded).

pilot_items: 20                  # per pool, run first; must parse >= 95% before the full run
min_parse_rate: 0.95
workers: 8
max_consecutive_errors: 10
run_provider_caps_usd: {bedrock: 6.00, typesafe: 0.01}
bootstrap: 2000
seed: 22
